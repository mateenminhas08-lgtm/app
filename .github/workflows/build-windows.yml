name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a10805-app
    paths:
      - ".github/workflows/build-windows.yml"
      - "src/**"
      - "scripts/build.ps1"
      - "pyproject.toml"
      - "requirements*.txt"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -e .
          python -m pip install "pyinstaller>=6.11,<7"

      - name: Build Windows application
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Create downloadable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist\AI Transcript" -DestinationPath "AI-Transcript-Windows-x64.zip" -CompressionLevel Optimal

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AI-Transcript-Windows-x64
          path: AI-Transcript-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
